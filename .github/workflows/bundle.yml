name: windows bundle

# Builds the PyInstaller one-dir bundle of the GUI and play CLI with Windows ML
# (packaging/slippi_ai.spec) and its installer (packaging/slippi_ai.iss), and
# checks that the frozen CLI executables start and load a model, before and
# after installing. The GUI is only built: windowed exes report errors in a
# dialog, which would hang CI.
#
# Pushing a launcher-v<version> tag, matching slippi_ai/gui/version.py, also
# publishes the installer as a GitHub release, which installed apps offer as
# an update (slippi_ai/gui/updates.py).

on: [push, pull_request]

jobs:
  bundle:

    runs-on: windows-latest

    permissions:
      contents: write  # To publish releases.

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install
      run: pip install .[gui,winml] pyinstaller

    - name: Build
      run: pyinstaller --noconfirm packaging/slippi_ai.spec

    - name: Parse flags
      shell: bash
      run: |
        dist/phillip/eval_two.exe --only_check_args
        dist/phillip/benchmark_eval_two.exe --only_check_args

    # Installed after the build so they can't end up in the bundle.
    - name: Export ONNX model
      run: |
        pip install .[onnx-export]
        python scripts/export_onnx.py --checkpoint slippi_ai/data/checkpoints/jax_demo --output jax_demo.onnx

    # Agents are built before Dolphin starts, so failing to find Dolphin means
    # onnxruntime loaded the model. Without the Windows App SDK Runtime,
    # Windows ML can't start and the model runs on the CPU.
    - name: Load ONNX model without Windows ML
      shell: bash
      env:
        DOLPHIN_PATH: C:/nonexistent
      run: |
        dist/phillip/eval_two.exe --p1.type=cpu --p2.ai.path=jax_demo.onnx "--p2.ai.name=Diamond Player" --dolphin.online_delay=0 > out.txt 2>&1 || true
        cat out.txt
        grep -q "Could not start Windows ML" out.txt
        grep -q "Running on CPU" out.txt
        grep -q "Unknown path" out.txt

    # Fetches the published model index and downloads a model over HTTPS from
    # the Hugging Face Hub, which the frozen app must still be able to do.
    - name: Download a published model
      shell: bash
      env:
        DOLPHIN_PATH: C:/nonexistent
        PHILLIP_CACHE: ${{ runner.temp }}/phillip-models
      run: |
        dist/phillip/eval_two.exe --p1.type=cpu --p2.ai.model=falco_d21_ditto_v6.1 --dolphin.online_delay=0 > out.txt 2>&1 || true
        grep -v '%|' out.txt
        ls -l "$PHILLIP_CACHE"/*/
        ls "$PHILLIP_CACHE"/index-v1.json "$PHILLIP_CACHE"/*/falco_d21_ditto_v6.1.onnx
        grep -q "Unknown path" out.txt

    - name: Build installer
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
        $version = python -c "from slippi_ai.gui.version import VERSION; print(VERSION)"
        & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" packaging/slippi_ai.iss
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Get-ChildItem dist/phillip-setup-*.exe

    # Per user and silent, as a player's install would be but without the
    # wizard. The installer downloads and installs the Windows App SDK Runtime.
    - name: Install
      run: |
        $setup = (Get-ChildItem dist/phillip-setup-*.exe).FullName
        $process = Start-Process $setup -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', `
            "/DIR=$env:RUNNER_TEMP\phillip", "/LOG=$PWD\install.log"
        Select-String -Path install.log -Pattern 'Windows App SDK Runtime', 'Downloading', 'exit code'
        exit $process.ExitCode

    # The runners have no GPU, so Windows ML offers no providers and the
    # model still runs on the CPU, but the installed app must start it.
    - name: Load ONNX model with Windows ML
      shell: bash
      env:
        DOLPHIN_PATH: C:/nonexistent
      run: |
        "$RUNNER_TEMP/phillip/eval_two.exe" --p1.type=cpu --p2.ai.path=jax_demo.onnx "--p2.ai.name=Diamond Player" --dolphin.online_delay=0 > out.txt 2>&1 || true
        cat out.txt
        grep -q "Windows ML providers:" out.txt
        grep -q "Unknown path" out.txt

    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/launcher-v')
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        version=$(python -c "from slippi_ai.gui.version import VERSION; print(VERSION)")
        if [ "$GITHUB_REF_NAME" != "launcher-v$version" ]; then
          echo "Tag $GITHUB_REF_NAME doesn't match VERSION $version in slippi_ai/gui/version.py."
          exit 1
        fi
        gh release create "$GITHUB_REF_NAME" "dist/phillip-setup-$version.exe" \
          --title "phillip $version" --generate-notes

    - uses: actions/upload-artifact@v4
      with:
        name: phillip-windows
        path: dist/phillip

    - uses: actions/upload-artifact@v4
      with:
        name: phillip-windows-installer
        path: dist/phillip-setup-*.exe
