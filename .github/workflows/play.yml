name: play install

# Checks that the minimal install (no extras) used to play against a trained
# agent works, including on Windows where the project isn't otherwise tested.

on: [push, pull_request]

jobs:
  play:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        os: ['windows-latest', 'macos-latest', 'ubuntu-latest']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: pip install .

    - name: Play path imports
      run: python tests/play_imports_test.py

    - name: Published model index and downloads
      run: python tests/models_test.py

    - name: Parse eval_two flags
      run: python scripts/eval_two.py --only_check_args

    # Model platforms, but still no training extras like wandb.
    - name: Install model platforms
      run: pip install .[jax,tf,onnx-export]

    - name: Load and run agents
      run: python tests/play_agent_test.py

    - name: ONNX export matches JAX
      run: python tests/onnx_test.py

    - name: Export ONNX model
      run: python scripts/export_onnx.py --checkpoint slippi_ai/data/checkpoints/jax_demo --output jax_demo.onnx

    # Check that exported models run with only onnxruntime, no jax or tf.
    - name: Run ONNX model without jax or tf
      shell: bash
      run: |
        python -m venv onnx-env
        if [ -d onnx-env/Scripts ]; then PY=onnx-env/Scripts/python; else PY=onnx-env/bin/python; fi
        $PY -m pip install .[onnx]
        $PY tests/play_agent_test.py --models jax_demo.onnx --no_jax_tf
