name: play install

# Checks that the minimal install (no extras) used to play against a trained
# agent works, including on Windows where the project isn't otherwise tested.

on: [push, pull_request]

jobs:
  play:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
        os: ['windows-latest', 'macos-latest', 'ubuntu-latest']

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: pip install .

    - name: Play path imports
      run: python tests/play_imports_test.py

    - name: Parse eval_two flags
      run: python scripts/eval_two.py --only_check_args

    # Model platforms, but still no training extras like wandb.
    - name: Install model platforms
      run: pip install .[jax,tf]

    - name: Load and run agents
      run: python tests/play_agent_test.py
