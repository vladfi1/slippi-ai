[metadata]
name = slippi-ai
version = 0.2.0
author = Vlad Firoiu
author_email = vladfi2@gmail.com
description = Imitation learning from slippi replays
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/vladfi1/slippi-ai
project_urls =
    Bug Tracker = https://github.com/vladfi1/slippi-ai/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages =
    slippi_ai
    slippi_ai/data
    slippi_ai/action_space
    slippi_ai/rl
    slippi_ai/jax
    slippi_ai/jax/q
    slippi_ai/jax/nash
    slippi_ai/jax/rl
    slippi_ai/sim_env
    slippi_ai/tf
    slippi_ai/nash
    slippi_ai/gui
    slippi_db
    skypilot
include_package_data = True
python_requires = >=3.12
# Keep the base install limited to what's needed to play against a trained
# agent; dependencies only used for training or dataset creation go in `train`.
install_requires =
    dm-tree
    melee>=0.47.1
    fancyflags
    numpy
    pyarrow
    portpicker
    tqdm

[options.extras_require]
dev =
    slippi-ai[train]
    ipdb
    ipython
    parameterized
    pylint>=2.14.0
    pytest
    nbstripout

train =
    dnspython
    fsspec
    pandas
    peppi-py-vladfi>=0.9.2
    py7zr
    skypilot
    webdataset
    pulp
    wandb

# Run exported ONNX models, without jax or tensorflow.
onnx =
    onnxruntime

# Like onnx, but with CUDA support (NVIDIA GPUs). The CUDA and cuDNN libraries
# come from pip. Conflicts with onnxruntime, so install one or the other.
onnx-cuda =
    onnxruntime-gpu[cuda,cudnn]

# Export JAX checkpoints to ONNX (scripts/export_onnx.py).
onnx-export =
    slippi-ai[jax,onnx]
    onnx
    jax2onnx

# The desktop app for local play (python -m slippi_ai.gui). Install with onnx
# or onnx-cuda to run models.
gui =
    PySide6-Essentials

twitchbot =
    twitchio<3.0.0
    ray

tf =
    dm-sonnet
    tf-nightly
    tfp-nightly[tf]
    # tfp imports distutils.version, which was removed from the stdlib in 3.12;
    # setuptools provides a shim. Venvs no longer ship setuptools by default.
    setuptools

tf-cuda =
    slippi-ai[tf]
    tf-nightly[and-cuda]

jax =
    jax<=0.10.1  # https://github.com/jax-ml/jax/issues/38806
    flax>=0.12
    qpax>=0.0.10
    tfp-nightly
    linrax
    mpax

cuda12 =
    jax[cuda12]
    nvidia-ml-py

cuda13 =
    jax[cuda13]
    nvidia-ml-py

jax-tf-cuda =
    slippi-ai[jax]
    jax[cuda12]
    slippi-ai[tf-cuda]
